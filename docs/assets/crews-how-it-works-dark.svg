    <text x="138.5" y="488" font-size="19" class="mono" text-anchor="middle" textLength="80.07" lengthAdjust="spacingAndGlyphs">produce</text>
    <rect x="215" y="461" width="111" height="40" rx="4" fill="#202731"/>
    <text x="270.5" y="488" font-size="19" class="mono" text-anchor="middle" textLength="57.19" lengthAdjust="spacingAndGlyphs">check</text>
