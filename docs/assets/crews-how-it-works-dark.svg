<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="870" viewBox="0 0 1800 870" role="img" aria-labelledby="title desc">
  <title id="title">How crews works: roles, plan, guard, waves</title>
  <desc id="desc">A developer or lead AI agent in Claude Code writes roles, each specifying what it does, what it delivers, and a work kind: produce, check, research, or integrate. crews creates a deterministic plan: the same roles give the same plan. Every role gets a seat consisting of a specific model and effort level, matched to difficulty: easier work gets a cheaper seat and harder work a stronger seat. Seats are grouped into one wave per kind, always in the order research, produce, integrate, check. Seats in a wave run in parallel and the next wave starts when all of them finish. Every agent dispatch is checked against the plan by a seat guard; planned seats pass, and unplanned crew seats and generic agents are blocked; other named agents are not affected. Checkers receive only the work and criteria, never the producer's conclusion.</desc>
  <style>
    text { font-family: "DejaVu Sans", Arial, sans-serif; font-kerning: none; font-variant-ligatures: none; }
    .bold { font-weight: 700; }
    .mono { font-family: "DejaVu Sans Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
  </style>
