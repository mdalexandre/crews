    <text x="77" y="389" font-size="23" class="mono" fill="#FFB04A">&gt;</text>
    <text x="107" y="389" font-size="24" textLength="189.07" lengthAdjust="spacingAndGlyphs">What it delivers</text>
    <text x="74" y="440" font-size="22" fill="#AEB8C5">Work kind</text>

