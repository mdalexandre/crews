name: Bug report
description: Something does not work as documented
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A minimal roles file and answers file help the most. Remove anything private.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Crews version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: claude
    attributes:
      label: Claude Code version and operating system
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Error output
      description: Paste the refusal or hook message. Do not paste API keys.
      render: shell
